{% extends 'base.html' %}
{% block title %}تأكيد الحذف{% endblock %}
{% block content %}
<div class="container" style="max-width:500px;">
    <div class="card-modern text-center p-5">
        <div class="mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                 style="width:80px;height:80px;background:#fadbd8;">
                <i class="fas fa-trash-alt fa-2x text-danger"></i>
            </div>
            <h2 class="fw-800 text-danger">تأكيد الحذف</h2>
            <p class="text-muted">هل أنت متأكد من حذف <strong>{{ object }}</strong>؟</p>
            <p class="text-danger small"><i class="fas fa-exclamation-triangle me-1"></i>لا يمكن التراجع عن هذه العملية</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next|default:request.META.HTTP_REFERER }}">
            <div class="d-flex gap-2 justify-content-center">
                <button type="submit" class="btn btn-danger rounded-pill px-4">
                    <i class="fas fa-trash me-1"></i>حذف
                </button>
                <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="fas fa-times me-1"></i>إلغاء
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
