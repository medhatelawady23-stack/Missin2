{% extends 'base.html' %}
{% block title %}{{ form_title|default:"إدارة المستخدمين" }}{% endblock %}
{% block content %}
<div class="container" style="max-width:620px;">
    <div class="d-flex align-items-center mb-4 gap-3">
        <a href="{{ cancel_url|default:'/admin/users/' }}" class="btn btn-outline-secondary rounded-pill">
            <i class="fas fa-arrow-right"></i>
        </a>
        <h1 class="section-title mb-0">
            {{ form_title }}
        </h1>
    </div>
    <div class="card-modern p-4">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-key me-1 text-primary"></i>
                    كلمة المرور {% if object %}<small class="text-muted">(اتركها فارغة لعدم التغيير)</small>{% endif %}
                </label>
                <input type="password" name="password" class="form-control" placeholder="كلمة المرور">
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary-custom">
                    <i class="fas fa-save me-1"></i>حفظ البيانات
                </button>
                <a href="{{ cancel_url|default:'/admin/users/' }}" class="btn btn-outline-secondary" style="border-radius:10px;">
                    إلغاء
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
